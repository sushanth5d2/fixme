services:
  # ── PostgreSQL ─────────────────────────────────────────────
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: fixme_postgres
    environment:
      POSTGRES_USER: fixme
      POSTGRES_PASSWORD: fixme_dev_password
      POSTGRES_DB: fixme_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fixme -d fixme_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - fixme_network

  # ── Redis ──────────────────────────────────────────────────
  redis:
    image: redis:7.4-alpine
    container_name: fixme_redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - fixme_network

  # ── MinIO (S3-compatible object storage) ──────────────────
  minio:
    image: minio/minio:RELEASE.2024-08-17T01-24-54Z
    container_name: fixme_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: fixme_minio_key
      MINIO_ROOT_PASSWORD: fixme_minio_secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped
    networks:
      - fixme_network

  # ── MinIO Bucket Setup (runs once) ────────────────────────
  minio-setup:
    image: minio/mc:RELEASE.2024-08-17T11-33-50Z
    container_name: fixme_minio_setup
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set fixme http://minio:9000 fixme_minio_key fixme_minio_secret;
      mc mb --ignore-existing fixme/fixme-customer-media;
      mc mb --ignore-existing fixme/fixme-fixer-documents;
      mc mb --ignore-existing fixme/fixme-repair-media;
      mc mb --ignore-existing fixme/fixme-message-attachments;
      mc anonymous set none fixme/fixme-fixer-documents;
      mc anonymous set none fixme/fixme-message-attachments;
      echo 'MinIO buckets created successfully';
      "
    networks:
      - fixme_network
    restart: no

  # ── NestJS API ─────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: infrastructure/docker/api/Dockerfile
      target: development
    container_name: fixme_api
    env_file:
      - apps/api/.env
    environment:
      DB_HOST: postgres
      REDIS_HOST: redis
      S3_ENDPOINT: http://minio:9000
    ports:
      - "3000:3000"
    volumes:
      - ./apps/api/src:/app/apps/api/src:ro
      - ./packages:/app/packages:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    networks:
      - fixme_network

  # ── Prometheus ─────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.54.0
    container_name: fixme_prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    ports:
      - "9090:9090"
    volumes:
      - ./infrastructure/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    restart: unless-stopped
    networks:
      - fixme_network

  # ── Grafana ────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:11.1.0
    container_name: fixme_grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: fixme_grafana_dev
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3100:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infrastructure/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - fixme_network

volumes:
  postgres_data:
  redis_data:
  minio_data:
  prometheus_data:
  grafana_data:

networks:
  fixme_network:
    driver: bridge
